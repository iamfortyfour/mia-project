<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe3d</title></head>
<body style="background:#11111b;margin:0"><canvas id="c" width="320" height="180"></canvas>
<script type="module">
window.__probe = "старт";
try {
  const THREE = await import("./vendor/three.module.js");
  const c = document.getElementById("c");
  const r = new THREE.WebGLRenderer({ canvas: c, antialias: false });
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(50, 320 / 180, 0.1, 100);
  cam.position.z = 3;
  const geo = new THREE.TorusGeometry(1, 0.02, 8, 64);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xcba6f7 }));
  scene.add(mesh);
  r.render(scene, cam);
  const gl = r.getContext();
  window.__probe = `OK three r${THREE.REVISION} | ${gl.getParameter(gl.VERSION)} | ${gl.getParameter(gl.RENDERER)} | draw calls ${r.info.render.calls}`;
} catch (e) { window.__probe = "ОШИБКА: " + e.message; }
</script></body></html>
